<div class="page">

  <div class="table-card">

    <h1>Test Requests</h1>

    <!-- Loading -->
    <div *ngIf="loading">Loading data...</div>

    <!-- Error -->
    <div *ngIf="errorMessage && !loading" class="error">
      {{ errorMessage }}
    </div>

    <!-- Total -->
    <div *ngIf="!loading && !errorMessage">
      Total Requests: {{ requests.length || 0 }}
    </div>

    <!-- Table -->
    <div 
      class="table-wrapper"
      *ngIf="!loading && !errorMessage && requests && requests.length > 0; else noData"
    >

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Company Name</th>
            <th>Submitted By</th>
            <th>Priority</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of requests; trackBy: trackById">
            <td>{{ item.id }}</td>
            <td>{{ item.company_name }}</td>
            <td>{{ item.submitted_by }}</td>
            <td>{{ item.priority }}</td>
            <td>{{ item.created_at | date:'short' }}</td>
            <td>
              <!-- <button (click)="viewTest(item.id)">View</button> -->
              <button class="track-btn" (click)="viewTest(item.id)">
                  View
              </button>
            </td>
          </tr>
        </tbody>
      </table>

    </div>

    <!-- No Data -->
    <ng-template #noData>
      <div *ngIf="!loading && !errorMessage">
        No test requests found
      </div>
    </ng-template>

  </div>

</div>
