<div class="page">

  <div class="card">

    <h1>Lab Test Screen</h1>

    <p *ngIf="loading">
      Loading Test Data...
    </p>

    <p *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </p>

    <div *ngIf="test && !loading">

      <div class="info">

        <p>
          <b>Company:</b>
          {{ test.company_name }}
        </p>

        <p>
          <b>Sample ID:</b>
          {{ test.id }}
        </p>

      </div>

      <hr>

      <h3>Tests Required</h3>

      <div class="test-list">

        <div
          class="test-item"
          *ngFor="let t of testsRequired">

          <label>

            <input
              type="checkbox"
              [checked]="selectedTests.includes(t)"
              (change)="toggleTest(t)"
            >

            {{ t }}

          </label>

          <button
            [disabled]="selectedTests.includes(t)"
            (click)="markDone(t)">

            {{
              selectedTests.includes(t)
              ? 'Completed'
              : 'Done'
            }}

          </button>

        </div>

      </div>

      <hr>

      <div class="selected-box">

        <h3>Completed Tests</h3>

        <ul>

          <li
            *ngFor="
              let item
              of selectedTests
            ">

            ✅ {{ item }}

          </li>

        </ul>

      </div>

    </div>

  </div>

</div>
