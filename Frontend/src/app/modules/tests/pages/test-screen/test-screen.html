<div class="page">

  <div class="card">

    <h1>Lab Test Screen</h1>

    <!-- Loading -->
    <p *ngIf="loading">
      Loading Test Data...
    </p>


    <!-- Error -->
    <p *ngIf="errorMessage" class="error">
      {{ errorMessage }}
    </p>


    <!-- Test Data -->
    <div *ngIf="test && !loading">

      <!-- ============================= -->
      <!-- SAMPLE INFORMATION -->
      <!-- ============================= -->

      <div class="info">

        <p>
          <b>Company:</b>
          {{ test.company_name }}
        </p>

        <p>
          <b>Sample ID:</b>
          {{ test.id }}
        </p>

      </div>


      <hr>


      <!-- ============================= -->
      <!-- TESTS REQUIRED -->
      <!-- ============================= -->

      <h3>Tests Required</h3>

      <div class="test-list">

        <div
          class="test-item"
          *ngFor="let t of testsRequired"
        >

          <!-- Test name + checkbox -->

          <label>

            <input
              type="checkbox"
              [checked]="isCompleted(t)"
              disabled
            >

            {{ t }}

          </label>


          <!-- Done / Completed button -->

          <button
            type="button"
            [disabled]="isCompleted(t)"
            (click)="markDone(t)"
          >

            {{
              isCompleted(t)
                ? 'Completed'
                : 'Done'
            }}

          </button>

        </div>

      </div>


      <hr>


      <!-- ============================= -->
      <!-- COMPLETED TESTS -->
      <!-- ============================= -->

      <div class="selected-box">

        <h3>Completed Tests</h3>


        <!-- If completed tests exist -->

        <ul *ngIf="completedTests.length > 0">

          <li
            *ngFor="let item of completedTests"
          >

            ✅ {{ item }}

          </li>

        </ul>


        <!-- If no tests are completed -->

        <p *ngIf="completedTests.length === 0">

          No tests completed yet.

        </p>

      </div>

    </div>

  </div>

</div>
